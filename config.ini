[CLASSES]
CLASS_1=BRAWLER|Melee DPS|Fist-form striker|2|/assets/class-brawler.png|A close-range pressure class built around fast engages, chase pressure and punishing enemies who overextend. Brawler performs best when forcing small skirmishes instead of standing in the middle of a full ranged fight.|Strong duelist with reliable gap-close pressure and high burst when targets are isolated.|Struggles when kited by coordinated ranged classes or locked down before reaching the backline.
CLASS_2=ARCHER|Ranged DPS|Sniper / scout|3|/assets/class-archer.png|A spacing-based marksman that wins by controlling distance, poking safely and finishing weakened enemies before they can reset. Archer rewards map awareness, target selection and clean movement.|Excellent range, safe poke and strong pick potential against low-health targets.|Vulnerable when melee classes close the gap or when caught without room to reposition.
CLASS_3=SWORDSMAN|Tank / DPS|Frontline stopper|2|/assets/class-swordsman.png|A durable frontline class that protects space, absorbs pressure and creates openings for the team. Swordsman is ideal for players who want to anchor pushes, peel for allies and survive extended fights.|High survivability and strong frontline control make it reliable in group clashes.|Lower chase speed and burst compared with pure DPS classes, so mobile targets can escape.
CLASS_4=SHAMAN|Support|Elemental binder|4|/assets/class-shaman.png|A tactical support class focused on sustain, buffs and fight control. Shaman shines when playing behind the frontline, keeping key allies alive and turning long fights through timing and positioning.|Valuable in organized PvP because utility and sustain can swing extended team fights|Needs protection and careful positioning; focused burst or silence pressure can shut it down quickly.
CLASS_5=EXTREME|Hybrid|Heavy ordnance|3|/assets/class-extreme.png|A flexible combatant with heavy pressure tools and enough utility to adapt between offense and disruption. Extreme is best for players who like switching targets and creating chaos during crowded fights.|Versatile damage profile and disruptive pressure work well in messy group battles.|Can feel less specialized than pure classes, and poor cooldown timing leaves it exposed.
CLASS_6=GUNNER|Ranged DPS|Tech-augment vanguard|3|/assets/class-gunner.png|A ranged damage dealer built around steady pressure, burst windows and disciplined positioning. Gunner thrives when firing from protected angles and punishing enemies who commit too deep.|Strong sustained ranged damage and good backline threat in team fights.|Needs space and protection; collapses quickly when surrounded or forced into close combat.
CLASS_7=ASSASSIN|Burst DPS|Shadow operative|5|/assets/class-assassin.png|A high-risk burst class that specializes in flanking, target deletion and escaping before the enemy can respond. Assassin rewards patience, timing and reading the fight before committing.|Exceptional burst and backline threat against supports, archers and isolated carries.|Punishing to misplay; if the opening burst fails, it can be controlled and eliminated fast.
