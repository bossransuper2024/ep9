# Deploy the static site (public/) to GitHub Pages via Actions.
# No build framework needed: the site is plain HTML/JS and the /public
# folder is already the deployable site (index.html + /assets).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenerate public/assets/js/generated.js from config.ini so that any
      # change to config.ini is reflected on the live site without a manual build.
      - name: Regenerate config (config.ini -> public/assets/js/generated.js)
        run: npm run genconfig

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
