[MUSIC]
Enabled=true
Src=assets/audio/ranmixed-clean.mp3
Title=RanOnline EP9
Autoplay=false
; Bounce: pulse the page (scale) + ambient glow to the beat while BGM plays.
; Set to false to disable the audio-reactive effect.
Bounce=true
 ; Aggressive: add an extra, stronger page bounce driven by the LOW (bass)
 ; and HIGH (treble) frequency bands on top of the base bounce. The page
 ; literally bounces to the beat instead of just the background glow.
 Aggressive=false
 ; Per-band gain multipliers for Aggressive mode. LowGain scales the bass
 ; contribution (the "base low"), HighGain scales the treble contribution
 ; (the "base high"). Raise for more punch, lower for subtlety.
 LowGain=0.3
 HighGain=1.0

; Audio effects (click/hover sounds) - DISABLED BY DEFAULT
; Set Enabled=true to activate click/hover SFX on buttons, links, cards, etc.
; These are separate from the background music (BGM).
[MUSIC_AUDIO_FX]
Enabled=false
ClickVolume=0.3
HoverVolume=0.15

[BACKGROUND]
; Section background art motion (the constant zoom + gentle sway on every
; hero-bg-*.png). All values are editable here - no CSS/code change needed.
;   Zoom     = constant scale of the bg image (1.1 = 110% zoom)
;   Rotate   = max tilt in degrees each side (3 = sways -3deg .. +3deg)
;   Duration = seconds for ONE full back-and-forth sway (-3deg -> +3deg -> -3deg).
;              The -3deg -> +3deg half takes Duration/2 seconds. Use a bigger
;              number for a slower, calmer drift (e.g. 60 = 30s per side).
Zoom=1.1
Rotate=3
Duration=40

