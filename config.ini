[NEWS]
; The News section shows two tabs (Announcement + Event),
; each fed by its own CSV database (edit freely — no code change):
;   announcement.csv  columns: id,date,title,image,context
;   event.csv         columns: id,date,title,image,context
; (context = a .txt file in assets/content/ used for the preview snippet)
; Tabs/copy below are only used if both CSVs are missing.
Title=THE LATEST
Accent=NEWS.
Intro=Announcements, patch notes and live events — straight from the Ran Online EP9 team.
Background=assets/hero-bg-08.png
TabAnnouncement=Announcement
TabEvent=Event
; How many news cards to preview on the main page (the rest live on /news)
HomeLimit=4
; How many news cards per page on the /news listing (shows ‹ PREV / NEXT › when more)
PageSize=10

[NEWS_CONFIG]
; Centralized News list/reader configuration. Edit here, run `npm run build`.
; itemsPerPage: how many news rows per page (try 10 or 20). Single source — do
;   NOT hard-code the limit anywhere else in the code.
ItemsPerPage=10
; HiddenCategories: comma list of category keys to hide everywhere (News list,
; Main Page preview, standalone article pages AND their filter chips). Valid
; keys: NEWS, ANNOUNCEMENT, EVENT, GUIDE. Leave empty to show all. Example below
; hides the News + Guide categories so only Announcements/Events remain.
HiddenCategories=NEWS,GUIDE
; Toggle which fields/behaviors show in the list + isolated reader.
ShowImagesInList=false
ShowImagesInArticle=true
ShowDate=true
ShowCategory=true
ShowExcerpt=true
Pagination=true
PreviousLabel=Previous
NextLabel=Next

